name: One-time canonical core deck test migration

on:
  push:
    branches:
      - feature/visual-integration-checkpoint

permissions:
  contents: write

jobs:
  migrate-core-deck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-integration-checkpoint

      - name: Replace stale composition assumptions at the source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/game-engine/test/core-engine.test.ts';
          let source = fs.readFileSync(path, 'utf8');

          const oldImport = `  buildCoreDeck,\n  CANONICAL_DECK_SIZE,`;
          const newImport = `  buildCoreDeck,\n  CANONICAL_DECK_COUNTS,\n  CANONICAL_DECK_SIZE,`;
          if (!source.includes(oldImport)) throw new Error('Expected canonical deck import anchor was not found.');
          source = source.replace(oldImport, newImport);

          const oldTest = `test('buildCoreDeck is deterministic and has the expected core composition', () => {\n  const deckA = buildCoreDeck('deck-seed');\n  const deckB = buildCoreDeck('deck-seed');\n\n  assert.equal(deckA.length, CANONICAL_DECK_SIZE);\n  assert.deepEqual(deckA.map(card => card.id), deckB.map(card => card.id));\n\n  const colors: Array<'lime' | 'orange' | 'cyan' | 'purple'> = ['lime', 'orange', 'cyan', 'purple'];\n  for (const color of colors) {\n    const colorCards = deckA.filter(card => card.color === color);\n    assert.equal(colorCards.filter(card => card.kind === 'number').length, 19, \`${'${color}'} number card count\`);\n    assert.equal(colorCards.filter(card => card.kind === 'skip').length, 2, \`${'${color}'} skip card count\`);\n    assert.equal(colorCards.filter(card => card.kind === 'reverse').length, 2, \`${'${color}'} reverse card count\`);\n    assert.equal(colorCards.filter(card => card.kind === 'draw').length, 2, \`${'${color}'} draw card count\`);\n  }\n\n  assert.equal(deckA.filter(card => card.kind === 'wild').length, 4);\n});`;

          const newTest = `test('buildCoreDeck is deterministic and follows the canonical deck authority', () => {\n  const deckA = buildCoreDeck('deck-seed');\n  const deckB = buildCoreDeck('deck-seed');\n\n  assert.equal(deckA.length, CANONICAL_DECK_SIZE);\n  assert.deepEqual(deckA.map(card => card.id), deckB.map(card => card.id));\n\n  const actualCounts = Object.fromEntries(\n    Object.keys(CANONICAL_DECK_COUNTS).map(kind => [\n      kind,\n      deckA.filter(card => card.kind === kind).length\n    ])\n  );\n  assert.deepEqual(actualCounts, CANONICAL_DECK_COUNTS);\n\n  const colors: Array<'lime' | 'orange' | 'cyan' | 'purple'> = ['lime', 'orange', 'cyan', 'purple'];\n  for (const color of colors) {\n    const colorCards = deckA.filter(card => card.color === color);\n    assert.equal(colorCards.filter(card => card.kind === 'number').length, 19, \`${'${color}'} number card count\`);\n  }\n\n  for (const kind of ['skip', 'reverse', 'draw'] as const) {\n    assert.equal(\n      deckA.filter(card => card.kind === kind).every(card => card.color == null),\n      true,\n      \`${'${kind}'} cards must not invent gameplay color metadata\`\n    );\n  }\n});`;

          if (!source.includes(oldTest)) throw new Error('Expected stale core composition test was not found exactly once.');
          source = source.replace(oldTest, newTest);
          fs.writeFileSync(path, source);
          NODE

      - name: Verify the source edit
        run: |
          git diff --check
          grep -q 'CANONICAL_DECK_COUNTS' packages/game-engine/test/core-engine.test.ts
          if grep -q "wild').length, 4" packages/game-engine/test/core-engine.test.ts; then
            echo 'stale wild=4 assertion remains' >&2
            exit 1
          fi
          if grep -q "skip').length, 2" packages/game-engine/test/core-engine.test.ts; then
            echo 'stale per-color skip assertion remains' >&2
            exit 1
          fi

      - name: Commit the source migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/game-engine/test/core-engine.test.ts
          git commit -m 'test(engine): source core composition from canonical deck authority'
          git push origin HEAD:feature/visual-integration-checkpoint
